<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de partidas</title>
<link rel="icon" href="data:,">
<style>
:root{
  --light:#f0d9b5; --dark:#b58863; --hl:rgba(155,199,0,.45); --check:rgba(220,40,40,.55);
  --bg:#ffffff; --panel:#f6f6f4; --text:#1d1d1f; --muted:#6b6b70; --line:#e2e2de;
  --accent:#2f6fb5; --accent-bg:#dbe8f7; --comment:#1d7a46; --var:#4a4a4f;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
body.theme-blue{--light:#dee3e6;--dark:#8ca2ad;--hl:rgba(80,160,220,.45)}
body.theme-green{--light:#ffffdd;--dark:#86a666;--hl:rgba(255,220,60,.5)}
body.theme-gray{--light:#e8e8e8;--dark:#9a9a9a;--hl:rgba(80,160,220,.45)}
body.dark{--bg:#1e1f22;--panel:#26282c;--text:#ececec;--muted:#9a9ca3;--line:#3a3c41;--accent:#7fb2ff;--accent-bg:#2c3f5c;--comment:#6fd29a;--var:#c6c6c9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding:8px;gap:8px}
#head{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 6px;border-bottom:1px solid var(--line)}
#head .players{font-weight:650;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#head .players .elo{font-weight:400;color:var(--muted);font-size:13px}
#head .players .res{margin-left:8px;padding:1px 7px;border-radius:4px;background:var(--panel);border:1px solid var(--line);font-size:13px}
#head .event{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#head .titles{flex:1;min-width:0}
#gameSel{max-width:260px;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
#main{flex:1;display:flex;gap:10px;min-height:0}
#left{display:flex;flex-direction:column;gap:6px;align-items:center}
#right{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
/* Tablero */
#boardWrap{position:relative;flex:none;user-select:none;box-shadow:0 1px 4px rgba(0,0,0,.25);border-radius:3px;overflow:hidden}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%}
.sq{position:relative}
.sq.l{background:var(--light)} .sq.d{background:var(--dark)}
.sq.last::after{content:"";position:absolute;inset:0;background:var(--hl)}
.sq.chk{background-image:radial-gradient(circle,var(--check) 0%,rgba(220,40,40,.25) 55%,transparent 75%)}
.sq.mk-G::before,.sq.mk-R::before,.sq.mk-Y::before,.sq.mk-B::before{content:"";position:absolute;inset:0;z-index:0}
.sq.mk-G::before{background:rgba(21,120,27,.55)} .sq.mk-R::before{background:rgba(200,30,30,.55)}
.sq.mk-Y::before{background:rgba(230,180,0,.55)} .sq.mk-B::before{background:rgba(0,70,190,.5)}
.pc{position:absolute;inset:0;background-size:100% 100%;z-index:2;will-change:transform}
.pc.anim{transition:transform .22s ease}
.coord{position:absolute;font-size:calc(var(--sq) * .2);font-weight:650;z-index:1;pointer-events:none;line-height:1}
.coord.rk{top:3%;left:4%} .coord.fl{bottom:3%;right:6%}
.sq.l .coord{color:var(--dark)} .sq.d .coord{color:var(--light)}
#arrows{position:absolute;inset:0;pointer-events:none;z-index:3}
/* Controles */
#controls{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;line-height:1}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
button svg{width:18px;height:18px;fill:currentColor}
#controls button{padding:6px 11px}
/* Notación */
#moves{flex:1;overflow:auto;padding:10px 12px;line-height:1.75;font-size:14.5px}
#moves .gcomment{color:var(--comment);margin-bottom:6px}
.mv{cursor:pointer;padding:1px 3px;border-radius:4px;white-space:nowrap}
.mv:hover{background:var(--accent-bg)}
.mv.cur{background:var(--accent);color:#fff}
.main>.mv,.main>.mvn{font-weight:650}
.mvn{color:var(--muted);font-weight:400}
.nag{color:#b4361f;font-weight:650;margin-left:1px}
.cm{color:var(--comment);font-style:normal}
.var0{display:block;margin:2px 0 4px 14px;padding-left:8px;border-left:2px solid var(--line);color:var(--var);font-size:13.5px}
.varn{color:var(--var)}
.result{display:block;margin-top:8px;font-weight:700}
.err{color:#b4361f;font-size:12.5px;margin-top:8px}
#tools{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border-top:1px solid var(--line);background:var(--bg)}
#tools button{font-size:12.5px;padding:5px 8px}
#tools svg{width:15px;height:15px}
.foot{margin-left:auto;font-size:11px;color:var(--muted);align-self:center;padding-right:4px}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:10px}
#modal.open{display:flex}
#modal .box{background:var(--bg);color:var(--text);border-radius:10px;padding:16px;width:min(620px,100%);max-height:100%;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#modal h3{margin:0 0 10px;font-size:16px}
#modal label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
#modal input[type=text],#modal input[type=number],#modal textarea,#modal select{width:100%;font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
#modal textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;height:84px;resize:vertical}
#modal .row{display:flex;gap:10px;flex-wrap:wrap}
#modal .row>div{flex:1;min-width:120px}
#modal .chk{display:flex;gap:6px;align-items:center;color:var(--text);font-size:13px;margin-top:8px}
#modal .note{font-size:12px;color:var(--muted);margin-top:6px}
#modal .btns{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
#drop{position:fixed;inset:0;background:rgba(47,111,181,.25);border:4px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--accent);z-index:60}
#drop.on{display:flex}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222;color:#fff;padding:7px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70}
#toast.on{opacity:.92}
/* Disposición vertical (móvil o iframe estrecho) */
body.stack{overflow:auto}
body.stack #main{flex-direction:column}
body.stack #right{min-height:220px}
body.minimal #tools .owner{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <div class="titles"><div class="players" id="players"></div><div class="event" id="event"></div></div>
    <select id="gameSel" title="Elegir partida" hidden></select>
  </div>
  <div id="main">
    <div id="left">
      <div id="boardWrap"><div id="board"></div><svg id="arrows" viewBox="0 0 8 8"></svg></div>
      <div id="controls">
        <button id="bStart" title="Inicio (Inicio)"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14l-10-7z"/></svg></button>
        <button id="bPrev" title="Atrás (←)"><svg viewBox="0 0 24 24"><path d="M17 5v14L6 12z"/></svg></button>
        <button id="bPlay" title="Reproducir (Espacio)"><svg viewBox="0 0 24 24"><path id="playIcon" d="M7 5v14l11-7z"/></svg></button>
        <button id="bNext" title="Adelante (→)"><svg viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></svg></button>
        <button id="bEnd" title="Final (Fin)"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10-7z"/></svg></button>
        <button id="bFlip" title="Girar tablero (F)"><svg viewBox="0 0 24 24"><path d="M7 3l-4 4h3v9h2V7h3zM17 21l4-4h-3V8h-2v9h-3z"/></svg></button>
      </div>
    </div>
    <div id="right">
      <div id="moves"></div>
      <div id="tools">
        <button id="tOpen" class="owner" title="Abrir un archivo PGN de tu ordenador"><svg viewBox="0 0 24 24"><path d="M4 4h6l2 2h8v12H4zM12 9l-4 4h3v4h2v-4h3z"/></svg>Abrir PGN</button>
        <button id="tShare" class="owner" title="Obtener código iframe y enlace"><svg viewBox="0 0 24 24"><path d="M8.6 13.5 15.4 17.5M15.4 6.5 8.6 10.5" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/></svg>Compartir</button>
        <button id="tFen" title="Copiar FEN de la posición"><svg viewBox="0 0 24 24"><path d="M8 3h11v13h-2V5H8zM5 7h10v14H5z"/></svg>FEN</button>
        <button id="tPgn" title="Descargar la partida en PGN"><svg viewBox="0 0 24 24"><path d="M11 3h2v10l3-3 1.4 1.4L12 16.8 6.6 11.4 8 10l3 3zM5 19h14v2H5z"/></svg>PGN</button>
        <button id="tAnalyse" title="Analizar esta posición con motor en Lichess"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.6 5.6-1.4 1.4-5.6-5.6A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>Analizar</button>
        <span class="foot" id="foot"></span>
      </div>
    </div>
  </div>
</div>

<div id="modal"><div class="box">
  <h3>Compartir / incrustar en tu web</h3>
  <label>Dirección pública de este visor (donde lo tienes alojado)</label>
  <input type="text" id="mBase" placeholder="https://tuusuario.github.io/ajedrez/visor.html">
  <label>Origen de la partida</label>
  <select id="mMode">
    <option value="url">Enlazar al archivo PGN alojado (recomendado para bases con muchas partidas)</option>
    <option value="embed">Meter la partida dentro del propio enlace (no necesitas subir el PGN)</option>
  </select>
  <div id="mUrlRow"><label>Ruta o URL del archivo PGN (relativa al visor o completa)</label>
  <input type="text" id="mPgn" placeholder="partidas/torneo-2026.pgn"></div>
  <div class="row">
    <div><label>Ancho</label><input type="text" id="mW" value="100%"></div>
    <div><label>Alto (px)</label><input type="number" id="mH" value="600"></div>
    <div><label>Tablero</label><select id="mTheme"><option value="brown">Marrón</option><option value="blue">Azul</option><option value="green">Verde</option><option value="gray">Gris</option></select></div>
  </div>
  <div class="chk"><input type="checkbox" id="mPly"><label for="mPly" style="margin:0;color:inherit">Empezar en la posición actual</label></div>
  <div class="chk"><input type="checkbox" id="mFlip"><label for="mFlip" style="margin:0;color:inherit">Tablero girado (negras abajo)</label></div>
  <div class="chk"><input type="checkbox" id="mDark"><label for="mDark" style="margin:0;color:inherit">Modo oscuro</label></div>
  <div class="chk"><input type="checkbox" id="mAll" checked><label for="mAll" style="margin:0;color:inherit">Permitir elegir entre todas las partidas del archivo</label></div>
  <label>Código para pegar en tu blog (HTML)</label>
  <textarea id="mCode" readonly></textarea>
  <label>Enlace directo</label>
  <textarea id="mLink" readonly style="height:52px"></textarea>
  <div class="note" id="mNote"></div>
  <div class="btns"><button id="mCopyCode">Copiar código</button><button id="mCopyLink">Copiar enlace</button><button id="mClose">Cerrar</button></div>
</div></div>
<div id="drop">Suelta aquí tu archivo .pgn</div>
<div id="toast"></div>
<input type="file" id="file" accept=".pgn,.txt,text/plain" hidden>

<!-- PGN por defecto: puedes pegar aquí tus partidas si quieres que el visor las muestre sin parámetros -->

[Event "Partida de la Ópera"]
[Site "París"]

[Annotator "Ejemplo"]

{Una de las partidas más famosas de la historia: desarrollo rápido y ataque
directo contra un rey sin enrocar.}
1. e4 e5 2. Nf3 d6 3. d4 Bg4 $6 {Clava el caballo, pero cede la pareja de alfiles.}
(3... exd4 {es lo más habitual hoy.} 4. Nxd4 Nf6 5. Nc3 Be7)
4. dxe5 Bxf3 5. Qxf3 dxe5 6. Bc4 {[%cal Gc4f7,Gf3f7] Doble amenaza sobre f7.} Nf6
7. Qb3 Qe7 8. Nc3 {Morphy prefiere seguir desarrollando antes que comer peones.}
(8. Qxb7 Qb4+ 9. Qxb4 Bxb4+ {y las damas desaparecen.})
8... c6 9. Bg5 b5 $6 10. Nxb5 $1 cxb5 11. Bxb5+ Nbd7 12. O-O-O {[%csl Rd7,Re8]
Todas las piezas blancas apuntan a la columna d.} Rd8 13. Rxd7 $1 Rxd7 14. Rd1 Qe6
15. Bxd7+ Nxd7 16. Qb8+ $3 {[%cal Gb3b8] Sacrificio final de dama.} Nxb8
17. Rd8# {[%csl Re8]} 1-0

[Event "Partida Inmortal"]
[Site "Londres"]
[Date "1851.06.21"]
[Round "?"]
[White "Anderssen, Adolf"]
[Black "Kieseritzky, Lionel"]
[Result "1-0"]
[ECO "C33"]

1. e4 e5 2. f4 exf4 3. Bc4 Qh4+ 4. Kf1 b5 5. Bxb5 Nf6 6. Nf3 Qh6 7. d3 Nh5
8. Nh4 Qg5 9. Nf5 c6 10. g4 Nf6 11. Rg1 $5 cxb5 12. h4 Qg6 13. h5 Qg5 14. Qf3 Ng8
15. Bxf4 Qf6 16. Nc3 Bc5 17. Nd5 Qxb2 18. Bd6 $3 {Entrega las dos torres.} Bxg1
(18... Qxa1+ 19. Ke2 Qxg1 20. e5 {también gana.}) 19. e5 Qxa1+ 20. Ke2 Na6
21. Nxg7+ Kd8 22. Qf6+ $3 Nxf6 23. Be7# 1-0

[Event "Estudio"]
[Site "?"]
[Date "1921.??.??"]
[Round "?"]
[White "Réti, Richard"]
[Black "Estudio: juegan blancas y hacen tablas"]
[Result "1/2-1/2"]
[SetUp "1"]
[FEN "7K/8/k1P5/7p/8/8/8/8 w - - 0 1"]

{El rey blanco persigue dos objetivos a la vez: alcanzar el peón h y apoyar el suyo.}
1. Kg7 $1 h4 2. Kf6 Kb6 (2... h3 3. Ke7 h2 4. c7 Kb7 5. Kd7 {y ambos coronan.})
3. Ke5 $1 Kxc6 (3... h3 4. Kd6 h2 5. c7 h1=Q 6. c8=Q {tablas.}) 4. Kf4 $1 h3
5. Kg3 h2 6. Kxh2 1/2-1/2

/* ===================== Visor ===================== */
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const NAGS = {1:'!',2:'?',3:'!!',4:'??',5:'!?',6:'?!',7:'□',10:'=',13:'∞',14:'⩲',15:'⩱',16:'±',17:'∓',18:'+-',19:'-+',22:'⨀',23:'⨀',32:'⟳',33:'⟳',36:'→',37:'→',40:'↑',41:'↑',132:'⇆',133:'⇆',138:'⊕',139:'⊕',140:'∆',146:'N'};
const FIG = {K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘'};

const state = { games:[], gi:0, game:null, node:null, flip:false, playing:null, figurine:params.get('fig')!=='0',
  source:null /* {type:'url',url} | {type:'local'} */, rawText:'' };

/* ---------- Opciones de URL ---------- */
if (params.get('theme')) document.body.classList.add('theme-'+params.get('theme'));
if (params.get('dark')==='1') document.body.classList.add('dark');
state.flip = params.get('flip')==='1' || params.get('orient')==='black';
const SPEED = Math.max(300, +params.get('speed') || 1500);
const embedded = window.self !== window.top;
if ((embedded && params.get('edit')!=='1') || params.get('ui')==='min') document.body.classList.add('minimal');

/* ---------- Lectura de PGN ---------- */
function splitGames(text){
  text = text.replace(/\r\n?/g,'\n').replace(/^﻿/,'');
  const games=[]; let cur=[]; let inMoves=false;
  for (const line of text.split('\n')){
    const isTag = /^\s*\[\w+\s+".*"\]\s*$/.test(line);
    if (isTag && inMoves){ games.push(cur.join('\n')); cur=[]; inMoves=false; }
    if (!isTag && line.trim()!=='' && !line.startsWith('%')) inMoves=true;
    cur.push(line);
  }
  if (cur.join('').trim()) games.push(cur.join('\n'));
  return games.filter(g=>g.trim());
}

function parseCommands(text){
  const out={shapes:[], squares:[], clk:null, eval:null};
  text = text.replace(/\[%(\w+)\s+([^\]]*)\]/g,(m,cmd,arg)=>{
    arg=arg.trim();
    if (cmd==='csl') arg.split(',').forEach(s=>{s=s.trim(); if(/^[GRYB][a-h][1-8]$/.test(s)) out.squares.push({c:s[0],sq:s.slice(1)});});
    else if (cmd==='cal') arg.split(',').forEach(s=>{s=s.trim(); if(/^[GRYB][a-h][1-8][a-h][1-8]$/.test(s)) out.shapes.push({c:s[0],from:s.slice(1,3),to:s.slice(3,5)});});
    else if (cmd==='clk') out.clk=arg; else if (cmd==='eval') out.eval=arg;
    return '';
  });
  out.text = text.replace(/\s+/g,' ').trim();
  return out;
}

function parseGame(src){
  const headers={}; let body='';
  for (const line of src.split('\n')){
    const m=line.match(/^\s*\[(\w+)\s+"(.*)"\]\s*$/);
    if (m) headers[m[1]]=m[2].replace(/\\"/g,'"'); else body+=line+'\n';
  }
  const startFen = headers.FEN || START_FEN;
  const chess = new Chess();
  let rootOk=true; try{ chess.load(startFen); }catch(e){ rootOk=false; }
  const root={id:0,fen:rootOk?startFen:START_FEN,children:[],parent:null,ply:0,nags:[],comment:'',pre:''};
  const startPly = (()=>{const p=root.fen.split(' '); return (parseInt(p[5]||'1')-1)*2 + (p[1]==='b'?1:0);})();
  root.ply=startPly;
  const nodes=[root]; let error=null;
  const re=/\{[^}]*\}|;[^\n]*|\(|\)|\$\d+|[!?]{1,2}|\d+\.+|\.\.\.|1-0|0-1|1\/2-1\/2|\*|[^\s(){};$!?.]+(?:\.(?!\.))?/g;
  let cur=root, stack=[], justOpened=false, pending='', skipUntil=-1, result=headers.Result||'*';
  let tok;
  while((tok=re.exec(body))){
    let t=tok[0];
    if (skipUntil>=0){
      if (t==='(') stack.push(null);
      else if (t===')'){ const v=stack.pop(); if (stack.length<skipUntil){ cur=v; skipUntil=-1; } }
      continue;
    }
    if (t[0]==='{' || t[0]===';'){
      const txt = t[0]==='{' ? t.slice(1,-1) : t.slice(1);
      if (justOpened || (cur===root && !root.children.length && pending!=='' )) pending+=' '+txt;
      else (cur.comment ? cur.comment+=' '+txt : cur.comment=txt);
      continue;
    }
    if (t==='('){ stack.push(cur); cur=cur.parent||root; justOpened=true; continue; }
    if (t===')'){ if(stack.length){ cur=stack.pop(); } justOpened=false; pending=''; continue; }
    if (t[0]==='$'){ cur.nags.push(+t.slice(1)); continue; }
    if (/^[!?]{1,2}$/.test(t)){ const k={'!':1,'?':2,'!!':3,'??':4,'!?':5,'?!':6}[t]; cur.nags.push(k); continue; }
    if (/^\d+\.+$/.test(t) || t==='...') continue;
    if (/^(1-0|0-1|1\/2-1\/2|\*)$/.test(t)){ if(!stack.length) result=t; continue; }
    // jugada
    t=t.replace(/\.$/,'').replace(/^0-0-0/,'O-O-O').replace(/^0-0/,'O-O');
    let mv=null;
    try{ chess.load(cur.fen); mv=chess.move(t,{strict:false}); }catch(e){ mv=null; }
    if (!mv){
      error = error || `Jugada no válida "${t}" tras ${cur===root?'la posición inicial':moveLabel(cur)}`;
      skipUntil=stack.length; if (skipUntil===0){ break; }
      continue;
    }
    const n={id:nodes.length,san:mv.san,from:mv.from,to:mv.to,color:mv.color,fen:chess.fen(),parent:cur,children:[],ply:cur.ply+1,nags:[],comment:'',pre:pending.trim(),check:chess.inCheck()};
    pending=''; justOpened=false;
    cur.children.push(n); nodes.push(n); cur=n;
  }
  if (pending.trim() && !root.children.length) root.comment+=pending;
  for (const n of nodes){ n.cmd=parseCommands(n.comment||''); n.precmd=parseCommands(n.pre||''); }
  return {headers,root,nodes,result,error};
}
function moveNo(n){ return Math.ceil(n.ply/2); }
function moveLabel(n){ return moveNo(n)+(n.color==='w'?'.':'...')+n.san; }

/* ---------- Carga ---------- */
function loadText(text, source, gameIdx=0, startPly=null){
  state.rawText=text; state.source=source;
  state.games = splitGames(text).map(g=>({src:g, parsed:null}));
  if (!state.games.length){ toast('No se han encontrado partidas en el PGN'); return; }
  buildGameSelect();
  selectGame(Math.min(Math.max(gameIdx,0),state.games.length-1), startPly);
}
function getGame(i){ const g=state.games[i]; if(!g.parsed) g.parsed=parseGame(g.src); return g.parsed; }
function quickHeaders(src){ const h={}; src.replace(/^\s*\[(\w+)\s+"(.*)"\]/gm,(m,k,v)=>{h[k]=v;}); return h; }
function buildGameSelect(){
  const sel=$('gameSel'); sel.innerHTML='';
  const single = params.get('single')==='1';
  if (state.games.length<2 || single){ sel.hidden=true; return; }
  state.games.forEach((g,i)=>{
    const h=quickHeaders(g.src);
    const o=document.createElement('option'); o.value=i;
    o.textContent=`${i+1}. ${short(h.White)} - ${short(h.Black)}  ${h.Result||''}`;
    sel.appendChild(o);
  });
  sel.hidden=false;
}
function short(n){ return (n||'?').split(',')[0]; }
function selectGame(i, startPly=null){
  stop(); state.gi=i; state.game=getGame(i); $('gameSel').value=i;
  renderHeader(); renderMoves();
  let node=state.game.root;
  if (startPly!=null){ while(node.children.length && node.ply<startPly) node=node.children[0]; }
  goto(node,false);
  if (params.get('autoplay')==='1' && startPly==null) play();
}

function renderHeader(){
  const h=state.game.headers, esc=escapeHtml;
  const elo=e=>e&&e!=='?'&&e!=='0'?` <span class="elo">${esc(e)}</span>`:'';
  $('players').innerHTML=`${esc(h.White||'?')}${elo(h.WhiteElo)} - ${esc(h.Black||'?')}${elo(h.BlackElo)}<span class="res">${esc(state.game.result.replace('1/2-1/2','½-½'))}</span>`;
  const parts=[h.Event, h.Site, h.Round&&h.Round!=='?'&&h.Round!=='-'?'Ronda '+h.Round:null, fmtDate(h.Date), h.ECO, h.Annotator?'Notas: '+h.Annotator:null].filter(x=>x&&x!=='?'&&x!=='??');
  $('event').textContent=parts.join(' · ');
  document.title=`${h.White||'?'} - ${h.Black||'?'}`;
}
function fmtDate(d){ if(!d) return null; const p=d.split('.'); if(p[0].includes('?')) return null; return p.filter(x=>!x.includes('?')).reverse().join('/'); }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Notación ---------- */
function sanHtml(san){ return state.figurine ? escapeHtml(san).replace(/^[KQRBN]/,c=>FIG[c]).replace(/=([QRBN])/,(m,c)=>'='+FIG[c]) : escapeHtml(san); }
function nagHtml(n){
  if(!n.nags.length) return '';
  return n.nags.map(k=>NAGS[k]!==undefined?`<span class="nag">${k>6?' ':''}${NAGS[k]}</span>`:'').join('');
}
function cmHtml(cmd){ return cmd && cmd.text ? ` <span class="cm">${escapeHtml(cmd.text)}</span> ` : ''; }
function renderLine(start, depth){
  let html='', n=start, needNum=true;
  while(n){
    if (n.precmd.text){ html+=cmHtml(n.precmd); needNum=true; }
    const num = n.color==='w' ? `<span class="mvn">${moveNo(n)}.</span>` : (needNum?`<span class="mvn">${moveNo(n)}...</span>`:'');
    html+=`${num}<span class="mv" data-id="${n.id}">${sanHtml(n.san)}${nagHtml(n)}</span> `;
    needNum=false;
    if (n.cmd.text){ html+=cmHtml(n.cmd); needNum=true; }
    const p=n.parent;
    if (p.children[0]===n && p.children.length>1){
      for (const v of p.children.slice(1)){
        html+= depth===0 ? `<span class="var0">${renderLine(v,depth+1)}</span>` : `<span class="varn">(${renderLine(v,depth+1).trim()})</span> `;
      }
      needNum=true;
    }
    n=n.children[0];
  }
  return html;
}
function renderMoves(){
  const g=state.game, el=$('moves');
  let html='';
  if (g.root.cmd.text) html+=`<div class="gcomment">${escapeHtml(g.root.cmd.text)}</div>`;
  html+= g.root.children.length ? `<span class="main">${renderLine(g.root.children[0],0)}</span>` : '<span class="mvn">(sin jugadas)</span>';
  html+=`<span class="result">${escapeHtml(g.result.replace('1/2-1/2','½-½'))}</span>`;
  if (g.error) html+=`<div class="err">⚠ ${escapeHtml(g.error)}</div>`;
  el.innerHTML=html;
  // las variantes de primer nivel van en bloque; el texto principal en negrita
  el.querySelectorAll('.var0 .mv').forEach(x=>x.style.fontWeight='400');
}

/* ---------- Tablero ---------- */
const boardEl=$('board'); const squares={};
function buildBoard(){
  boardEl.innerHTML='';
  for (let r=0;r<8;r++) for (let f=0;f<8;f++){
    const file = state.flip ? 7-f : f, rank = state.flip ? r+1 : 8-r;
    const sq='abcdefgh'[file]+rank;
    const d=document.createElement('div');
    d.className='sq '+((file+rank)%2===0?'d':'l'); d.dataset.sq=sq;
    if (f===0){ const c=document.createElement('span'); c.className='coord rk'; c.textContent=rank; d.appendChild(c); }
    if (r===7){ const c=document.createElement('span'); c.className='coord fl'; c.textContent='abcdefgh'[file]; d.appendChild(c); }
    boardEl.appendChild(d); squares[sq]=d;
  }
}
function fenToMap(fen){
  const map={}; const rows=fen.split(' ')[0].split('/');
  rows.forEach((row,i)=>{ let f=0; for(const ch of row){ if(/\d/.test(ch)) f+=+ch; else { map['abcdefgh'[f]+(8-i)]=(ch===ch.toUpperCase()?'w':'b')+ch.toUpperCase(); f++; } } });
  return map;
}
function sqXY(sq){ const f=sq.charCodeAt(0)-97, r=+sq[1]-1; return state.flip?[7-f+.5, r+.5]:[f+.5, 7-r+.5]; }
function drawPosition(node, animate){
  const map=fenToMap(node.fen);
  for (const sq in squares){
    const d=squares[sq];
    d.querySelectorAll('.pc').forEach(p=>p.remove());
    d.classList.remove('last','chk','mk-G','mk-R','mk-Y','mk-B');
    if (map[sq]){ const p=document.createElement('div'); p.className='pc'; p.style.backgroundImage=`url("${PIECES[map[sq]]}")`; d.appendChild(p); }
  }
  if (node.from){ squares[node.from].classList.add('last'); squares[node.to].classList.add('last'); }
  if (node.check){ const turn=node.fen.split(' ')[1]; for(const sq in map) if(map[sq]===turn+'K') squares[sq].classList.add('chk'); }
  const cmd=node.cmd||{squares:[],shapes:[]};
  cmd.squares.forEach(s=>squares[s.sq]&&squares[s.sq].classList.add('mk-'+s.c));
  drawArrows(cmd.shapes);
  if (animate && node.from){
    const p=squares[node.to].querySelector('.pc');
    if (p){
      const [x1,y1]=sqXY(node.from),[x2,y2]=sqXY(node.to), sz=squares[node.to].offsetWidth;
      p.style.transform=`translate(${(x1-x2)*sz}px,${(y1-y2)*sz}px)`;
      p.getBoundingClientRect(); p.classList.add('anim'); p.style.transform='';
      // enroque: mueve también la torre
    }
  }
}
function drawArrows(shapes){
  const col={G:'#15781B',R:'#882020',Y:'#e68f00',B:'#003088'};
  let s='<defs>'; for(const c in col) s+=`<marker id="ah${c}" markerWidth="4" markerHeight="4" refX="2.05" refY="2" orient="auto"><path d="M0,0 V4 L3,2 Z" fill="${col[c]}"/></marker>`; s+='</defs>';
  for (const a of shapes){
    const [x1,y1]=sqXY(a.from),[x2,y2]=sqXY(a.to); const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
    const ex=x2-dx/len*.32, ey=y2-dy/len*.32;
    s+=`<line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="${col[a.c]}" stroke-width=".16" stroke-linecap="round" opacity=".8" marker-end="url(#ah${a.c})"/>`;
  }
  $('arrows').innerHTML=s;
}

/* ---------- Navegación ---------- */
function goto(node, animate=false){
  state.node=node; drawPosition(node, animate);
  document.querySelectorAll('.mv.cur').forEach(e=>e.classList.remove('cur'));
  const el=document.querySelector(`.mv[data-id="${node.id}"]`);
  if (el){ el.classList.add('cur'); const box=$('moves'); const r=el.getBoundingClientRect(), b=box.getBoundingClientRect();
    if (r.top<b.top+10 || r.bottom>b.bottom-10) box.scrollTop += (r.top-b.top) - b.height/2; }
  else if (!node.parent) $('moves').scrollTop=0;
  $('foot').textContent = node.parent ? moveLabel(node) : '';
}
const next=()=>{ const n=state.node.children[0]; if(n){ goto(n,true); return true;} return false; };
const prev=()=>{ if(state.node.parent) goto(state.node.parent); };
const first=()=>goto(state.game.root);
const last=()=>{ let n=state.node; while(n.children[0]) n=n.children[0]; goto(n); };
function play(){ if(state.playing){ stop(); return; } if(!state.node.children[0]) first();
  state.playing=setInterval(()=>{ if(!next()) stop(); }, SPEED); $('bPlay').classList.add('on'); $('playIcon').setAttribute('d','M6 5h4v14H6zM14 5h4v14h-4z'); }
function stop(){ if(state.playing){ clearInterval(state.playing); state.playing=null; } $('bPlay').classList.remove('on'); $('playIcon').setAttribute('d','M7 5v14l11-7z'); }
function flip(){ state.flip=!state.flip; buildBoard(); goto(state.node); }

$('bStart').onclick=()=>{stop();first();}; $('bPrev').onclick=()=>{stop();prev();};
$('bNext').onclick=()=>{stop();next();}; $('bEnd').onclick=()=>{stop();last();};
$('bPlay').onclick=play; $('bFlip').onclick=flip;
$('gameSel').onchange=e=>selectGame(+e.target.value);
$('moves').addEventListener('click',e=>{ const m=e.target.closest('.mv'); if(m){ stop(); goto(state.game.nodes[+m.dataset.id]); } });
document.addEventListener('keydown',e=>{
  if (e.target.matches('input,textarea,select') || $('modal').classList.contains('open')) return;
  const k=e.key;
  if (k==='ArrowRight'){stop();next();} else if(k==='ArrowLeft'){stop();prev();}
  else if (k==='Home'||k==='ArrowUp'){stop();first();} else if(k==='End'||k==='ArrowDown'){stop();last();}
  else if (k===' '){play();} else if(k==='f'||k==='F'){flip();} else return;
  e.preventDefault();
});
let wheelLock=0;
$('boardWrap').addEventListener('wheel',e=>{ e.preventDefault(); const t=Date.now(); if(t-wheelLock<60) return; wheelLock=t; stop(); e.deltaY>0?next():prev(); },{passive:false});
// gestos táctiles en el tablero
let tx=null; $('boardWrap').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
$('boardWrap').addEventListener('touchend',e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>30){stop(); dx<0?next():prev();} tx=null; });

/* ---------- Herramientas ---------- */
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
async function copy(text,msg){ try{ await navigator.clipboard.writeText(text); }catch(e){ const a=document.createElement('textarea'); a.value=text; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); } toast(msg||'Copiado'); }
$('tFen').onclick=()=>copy(state.node.fen,'FEN copiado');
$('tPgn').onclick=()=>{ const g=state.games[state.gi].src.trim()+'\n'; const h=state.game.headers;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([g],{type:'application/x-chess-pgn'}));
  a.download=`${short(h.White)}-${short(h.Black)}.pgn`.replace(/[^\w.\-]+/g,'_'); a.click(); };
$('tAnalyse').onclick=()=>window.open('https://lichess.org/analysis/standard/'+state.node.fen.replace(/ /g,'_')+(state.flip?'?color=black':''),'_blank','noopener');
$('tOpen').onclick=()=>$('file').click();
$('file').onchange=e=>{ const f=e.target.files[0]; if(f) readFile(f); e.target.value=''; };
function readFile(f){ const r=new FileReader(); r.onload=()=>{ loadText(String(r.result),{type:'local',name:f.name}); toast(`${f.name}: ${state.games.length} partida(s)`); }; r.readAsText(f); }
let dragN=0;
window.addEventListener('dragenter',e=>{ if(document.body.classList.contains('minimal')) return; e.preventDefault(); dragN++; $('drop').classList.add('on'); });
window.addEventListener('dragleave',()=>{ if(--dragN<=0){ dragN=0; $('drop').classList.remove('on'); } });
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{ e.preventDefault(); dragN=0; $('drop').classList.remove('on'); if(document.body.classList.contains('minimal')) return; const f=e.dataTransfer.files[0]; if(f) readFile(f); });

/* ---------- Compartir (iframe) ---------- */
async function compress(str){
  const cs=new Blob([str]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  const buf=new Uint8Array(await new Response(cs).arrayBuffer());
  let bin=''; buf.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function decompress(b64){
  b64=b64.replace(/-/g,'+').replace(/_/g,'/'); const bin=atob(b64); const buf=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const ds=new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(ds).text();
}
function viewerBase(){ return location.protocol.startsWith('http') ? location.origin+location.pathname : ''; }
function openShare(){
  const base=localStorage.getItem('visorBase')||viewerBase();
  $('mBase').value=base;
  if (state.source && state.source.type==='url'){ $('mMode').value='url'; $('mPgn').value=state.source.url; }
  else { $('mMode').value='embed'; $('mPgn').value=localStorage.getItem('visorLastPgnPath')||('partidas/'+(state.source&&state.source.name||'partidas.pgn')); }
  $('mFlip').checked=state.flip; $('mPly').checked=false; $('mDark').checked=document.body.classList.contains('dark');
  const th=['brown','blue','green','gray'].find(t=>document.body.classList.contains('theme-'+t))||'brown'; $('mTheme').value=th;
  $('modal').classList.add('open'); updateShare();
}
async function updateShare(){
  const base=$('mBase').value.trim(); const mode=$('mMode').value;
  try{ localStorage.setItem('visorBase',base); if(mode==='url') localStorage.setItem('visorLastPgnPath',$('mPgn').value.trim()); }catch(e){}
  $('mUrlRow').style.display = mode==='url'?'':'none';
  $('mAll').parentElement.style.display = mode==='url'?'':'none';
  const q=new URLSearchParams(); let hash='';
  if (mode==='url'){ q.set('pgn',$('mPgn').value.trim()); if(state.games.length>1) q.set('game',state.gi+1); if(!$('mAll').checked) q.set('single','1'); }
  if ($('mPly').checked && state.node.parent) q.set('ply', state.node.ply - state.game.root.ply);
  if ($('mFlip').checked) q.set('flip','1');
  if ($('mTheme').value!=='brown') q.set('theme',$('mTheme').value);
  if ($('mDark').checked) q.set('dark','1');
  if (mode==='embed') hash='#z='+await compress(state.games[state.gi].src.trim());
  const qs=q.toString().replace(/%2F/g,'/').replace(/%3A/g,':');
  const url=(base||'URL_DEL_VISOR')+(qs?'?'+qs:'')+hash;
  const w=$('mW').value.trim()||'100%', h=$('mH').value||600;
  $('mLink').value=url;
  $('mCode').value=`<iframe src="${url}" width="${w}" height="${h}" style="border:0;max-width:100%" loading="lazy" allowfullscreen title="Partida de ajedrez"></iframe>`;
  $('mNote').textContent = !base ? 'Escribe arriba la dirección pública donde has subido visor.html.' :
    mode==='url' ? 'El archivo PGN debe estar subido en ese mismo sitio (o en un servidor que permita CORS).' :
    `La partida va comprimida dentro del enlace (${url.length} caracteres). Ideal para partidas sueltas.`;
}
$('tShare').onclick=openShare;
['mBase','mMode','mPgn','mW','mH','mTheme','mPly','mFlip','mDark','mAll'].forEach(id=>$(id).addEventListener('input',updateShare));
$('mClose').onclick=()=>$('modal').classList.remove('open');
$('modal').onclick=e=>{ if(e.target.id==='modal') $('modal').classList.remove('open'); };
$('mCopyCode').onclick=()=>copy($('mCode').value,'Código iframe copiado');
$('mCopyLink').onclick=()=>copy($('mLink').value,'Enlace copiado');

/* ---------- Tamaño adaptable ---------- */
function layout(){
  const W=innerWidth, H=innerHeight; const head=$('head').offsetHeight, ctr=$('controls').offsetHeight||36;
  const stack = W < 600 || W/H < 1.05;
  document.body.classList.toggle('stack',stack);
  let size;
  if (stack){ size=Math.min(W-16, Math.max(200, H-head-ctr-24-(W<600?0:200))); if(W<600) size=W-16; }
  else size=Math.min(H-head-ctr-36, W*0.64);
  size=Math.max(160, Math.floor(size/8)*8);
  const bw=$('boardWrap'); bw.style.width=bw.style.height=size+'px';
  document.documentElement.style.setProperty('--sq',(size/8)+'px');
  $('left').style.width = stack ? '100%' : size+'px';
  if (stack) $('right').style.height = Math.max(220, H-head-size-ctr-40)+'px'; else $('right').style.height='';
}
addEventListener('resize',layout);

/* ---------- Arranque ---------- */
async function init(){
  buildBoard(); layout();
  const gameIdx=(+params.get('game')||1)-1;
  const ply=params.has('ply')?+params.get('ply'):null;
  const fixPly = p => p==null ? null : p; // relativo al inicio de la partida
  try{
    if (location.hash.startsWith('#z=')){
      const txt=await decompress(location.hash.slice(3));
      loadText(txt,{type:'local',name:'partida.pgn'},0,null);
    } else if (params.get('pgn')){
      const url=params.get('pgn');
      const res=await fetch(url,{cache:'no-cache'}); if(!res.ok) throw new Error('HTTP '+res.status);
      loadText(await res.text(),{type:'url',url},gameIdx,null);
    } else {
      loadText($('pgn-default').textContent,{type:'local',name:'ejemplo.pgn'},gameIdx,null);
    }
    if (ply!=null){ let n=state.game.root; while(n.children[0] && n.ply-state.game.root.ply<ply) n=n.children[0]; goto(n); }
  }catch(e){
    $('moves').innerHTML=`<div class="err">No se pudo cargar el PGN (${escapeHtml(e.message)}).<br>Comprueba la ruta del archivo. Si abres el visor con doble clic (file://) el navegador bloquea la descarga: usa "Abrir PGN" o súbelo a tu web.</div>`;
  }
  layout();
}
init();
</script>
